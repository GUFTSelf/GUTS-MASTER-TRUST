name: VEK Platform Continuous Verification & Auditing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Clone Repository
      uses: actions/checkout@v4

    - name: Set up Node.js Runtime
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Workspace Dependencies
      run: npm install

    - name: [Audit] Verify Static Typings (TypeScript Compiler)
      run: npm run lint

    - name: [Audit] Execute Master Reference Simulation Matrix
      run: npm run verify

    - name: [Audit] Run Reproducible Benchmark Harness
      run: npm run benchmark

    - name: [Audit] Generate Deterministic Evaluation Snapshot
      run: |
        npm run report
        node scripts/validate_schema.js
        node scripts/slsa_grade.js
        node scripts/slsa_gate.js
        if [ -f "evaluation-kit/output/evaluation-manifest.zip" ]; then
          echo "Evaluation bundle snapshot compiled successfully."
        else
          echo "Error: Snapshotted evaluation-manifest.zip is missing!"
          exit 1
        fi

    - name: [Audit] Validate SBOM Configuration Integrity
      run: |
        if [ -f "releases/v1.0.0/sbom.json" ]; then
          echo "SBOM verified successfully."
        else
          echo "Error: SBOM artifact missing!"
          exit 1
        fi

    - name: [Audit] Verify Release Checksums
      run: |
        if [ -f "releases/v1.0.0/checksums.sha256" ]; then
          echo "Release checksum matrix verified."
        else
          echo "Error: Checksums ledger missing!"
          exit 1
        fi
